name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag, or branch to build (defaults to the branch selected above)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      sha: ${{ steps.check.outputs.sha }}
      previous: ${{ steps.check.outputs.previous }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          sha=$(git rev-parse HEAD)
          last=$(git rev-parse --verify --quiet 'refs/tags/nightly^{commit}' || true)
          if [ "$EVENT_NAME" = schedule ] && [ "$sha" = "$last" ]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo "No commits since the last nightly (${sha:0:7}), skipping."
            exit 0
          fi
          {
            echo 'publish=true'
            echo "sha=$sha"
            # The commit the published nightly was built from, before the
            # tag moves; the new nightly's notes list the commits since it.
            echo "previous=$last"
            echo "version=$(date -u '+%d.%m.%Y') (nightly ${sha:0:7})"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      channel: nightly
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          # Publish lists the commit subjects since the previous nightly.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum marasi-app marasi-app.exe marasi-app.app.zip > checksums.txt
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Sign checksums
        working-directory: dist
        env:
          SIGNING_KEY: ${{ secrets.MARASI_SIGNING_KEY }}
          SIGNING_PUBLIC_KEY: ${{ vars.MARASI_SIGNING_PUBLIC_KEY }}
          CHANNEL: nightly
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::repository secret MARASI_SIGNING_KEY is not set"
            exit 1
          fi
          if [ -z "$SIGNING_PUBLIC_KEY" ]; then
            echo "::error::repository variable MARASI_SIGNING_PUBLIC_KEY is not set"
            exit 1
          fi
          go install aead.dev/minisign/cmd/minisign@v0.3.0
          key_file="$RUNNER_TEMP/minisign.key"
          trap 'rm -f "$key_file"' EXIT
          (umask 077 && printf '%s\n' "$SIGNING_KEY" > "$key_file")
          "$(go env GOPATH)/bin/minisign" -S -s "$key_file" -m checksums.txt \
            -t "marasi-app $CHANNEL $VERSION"
          # Fails the job if the secret and the key built into the app differ.
          "$(go env GOPATH)/bin/minisign" -V -H -P "$SIGNING_PUBLIC_KEY" -m checksums.txt
      - name: Move nightly tag
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          git tag -f nightly "$SHA"
          git push origin refs/tags/nightly --force
      - name: Publish nightly
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref || github.ref_name }}
          SHA: ${{ needs.prepare.outputs.sha }}
          # The previous nightly's commit, read before its tag moved; empty
          # for the first nightly.
          PREVIOUS: ${{ needs.prepare.outputs.previous }}
          # The app reads the nightly's date from its title (its version
          # string) and its commit from the Commit line of its notes; it
          # shows the commit subjects above that line as the notes.
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # The commits since the previous nightly, newest first. Without a
          # previous nightly, or when its commit is not an ancestor (history
          # rewritten, or a build of another branch), the 20 most recent.
          if [ -n "$PREVIOUS" ] && git merge-base --is-ancestor "$PREVIOUS" "$SHA" 2>/dev/null; then
            range="$PREVIOUS..$SHA"
            limit=100
            total=$(git rev-list --no-merges --count "$range")
          else
            range="$SHA"
            limit=20
            total=0
          fi
          subjects=$(git log --no-merges --format='- %s' -n "$limit" "$range")
          if [ "$total" -gt "$limit" ]; then
            subjects=$(printf '%s\n- …and %d more' "$subjects" "$((total - limit))")
          fi
          if [ -n "$subjects" ]; then
            notes=$(printf '%s\n\nRef: %s\nCommit: %s\n' "$subjects" "$REF" "$SHA")
          else
            notes=$(printf 'Ref: %s\nCommit: %s\n' "$REF" "$SHA")
          fi
          if gh release view nightly >/dev/null 2>&1; then
            gh release delete nightly --yes
          fi
          gh release create nightly \
            --verify-tag \
            --title "$VERSION" \
            --prerelease \
            --latest=false \
            --notes "$notes" \
            dist/marasi-app \
            dist/marasi-app.exe \
            dist/marasi-app.app.zip \
            dist/checksums.txt \
            dist/checksums.txt.minisig
